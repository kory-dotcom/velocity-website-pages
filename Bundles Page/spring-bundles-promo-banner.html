<!-- CSS for the Graduation Season Floating Popup Banner (Desktop + Mobile) -->
<style>
	@import url('https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&display=swap');

	:root {
		--sb-navy: #10182B;
		--sb-magenta: #EE265F;
		--sb-blue: #293893;
		--sb-yellow: #FDC70C;
	}

	/* =========================================
	   FLOATING CARD (Desktop + Mobile)
	   ========================================= */
	#sb-promo-card {
		display: none;
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		width: 90%;
		max-width: 520px;
		/* Sits above page content but below the site navbar (9999) and its mobile menu overlay (10000+),
		   so opening the hamburger menu cleanly covers the banner. */
		z-index: 9000;
		background: white;
		border-radius: 28px;
		overflow: hidden;
		box-shadow: 0 30px 60px rgba(16, 24, 43, 0.45);
		text-align: center;
		font-family: 'Khand', system-ui, sans-serif;
		animation: sb-card-entry 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
	}

	#sb-promo-minimized {
		display: none;
		position: fixed;
		bottom: 30px;
		right: 30px;
		z-index: 9000;
		background: var(--sb-magenta);
		color: white;
		padding: 12px 28px;
		border-radius: 50px;
		cursor: pointer;
		font-family: 'Khand', system-ui, sans-serif;
		text-transform: uppercase;
		font-weight: 700;
		font-style: italic;
		font-size: 17px;
		letter-spacing: 0.5px;
		box-shadow: 0 10px 20px rgba(238, 38, 95, 0.35);
		transition: transform 0.2s;
		animation: sb-bounce-in 0.5s;
	}

	#sb-promo-minimized:hover {
		transform: scale(1.1);
	}

	.sb-card-header {
		background: linear-gradient(162deg, #191B4D 0%, var(--sb-navy) 100%);
		padding: 40px 24px 48px;
		position: relative;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		border-radius: 28px 28px 0 0;
	}

	/* Allow the cap to fly above the card during the celebration toss. */
	#sb-promo-card.sb-card-throw-active { overflow: visible; }

	.sb-cap-icon {
		width: 64px;
		height: auto;
		color: var(--sb-yellow);
		margin-bottom: 14px;
		filter: drop-shadow(0 6px 14px rgba(253, 199, 12, 0.35));
		transform-origin: 50% 80%;
		cursor: pointer;
		-webkit-tap-highlight-color: transparent;
	}

	.sb-eyebrow {
		display: inline-block;
		padding: 6px 20px;
		font-size: 13px;
		font-weight: 700;
		font-style: italic;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: #fff;
		background: linear-gradient(135deg, #D22026 0%, var(--sb-magenta) 100%);
		border-radius: 0;
		margin-bottom: 16px;
	}

	.sb-headline {
		font-size: 42px;
		line-height: 1.05;
		text-transform: uppercase;
		font-weight: 700;
		font-style: italic;
		color: white;
		letter-spacing: 0.02em;
		margin: 0;
	}

	.sb-headline span {
		color: var(--sb-yellow);
	}

	.sb-card-body {
		padding: 28px 36px 40px;
		background: white;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 12px;
		border-radius: 0 0 28px 28px;
	}

	.sb-subtitle {
		font-size: 20px;
		text-transform: uppercase;
		color: var(--sb-navy);
		font-weight: 600;
		font-style: italic;
		margin: 0;
		line-height: 1.25;
		letter-spacing: 0.02em;
	}

	.sb-card-btn {
		position: relative;
		background: var(--sb-magenta);
		color: white;
		text-decoration: none;
		font-family: 'Khand', system-ui, sans-serif;
		font-size: 28px;
		font-weight: 700;
		font-style: italic;
		display: inline-block;
		border-radius: 14px;
		padding: 14px 48px;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		transition: all 0.3s ease;
		box-shadow: 0 10px 25px rgba(238, 38, 95, 0.35);
		animation: sb-btn-pulse 2s infinite;
	}

	.sb-card-btn:hover {
		transform: scale(1.05);
		background: #d41e53;
		color: white;
	}

	.sb-controls {
		position: absolute;
		top: 14px;
		right: 18px;
		z-index: 10;
	}

	.sb-control-btn {
		cursor: pointer;
		font-size: 22px;
		color: rgba(255,255,255,0.4);
		transition: all 0.2s;
		font-family: Arial, sans-serif;
	}

	.sb-control-btn:hover { color: white; }

	/* =========================================
	   MOBILE TIGHTENING (≤ 768px)
	   Same floating popup, scaled down for phones.
	   ========================================= */
	@media (max-width: 768px) {
		#sb-promo-card {
			max-width: 380px;
			border-radius: 22px;
		}
		.sb-card-header {
			padding: 30px 20px 34px;
			border-radius: 22px 22px 0 0;
		}
		.sb-card-body {
			padding: 22px 24px 30px;
			border-radius: 0 0 22px 22px;
		}
		.sb-cap-icon {
			width: 50px;
			margin-bottom: 10px;
		}
		.sb-eyebrow {
			padding: 5px 16px;
			font-size: 11px;
			margin-bottom: 12px;
		}
		.sb-headline {
			font-size: 32px;
		}
		.sb-subtitle {
			font-size: 17px;
		}
		.sb-card-btn {
			font-size: 22px;
			padding: 12px 36px;
			border-radius: 12px;
		}
		.sb-controls {
			top: 10px;
			right: 12px;
		}
		.sb-control-btn {
			font-size: 24px;
			color: rgba(255,255,255,0.55);
		}
		#sb-promo-minimized {
			bottom: 16px;
			right: 16px;
			padding: 10px 22px;
			font-size: 15px;
		}
	}

	/* Animations */
	@keyframes sb-card-entry {
		from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
		to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
	}
	@keyframes sb-bounce-in {
		0% { transform: scale(0); }
		100% { transform: scale(1); }
	}
	@keyframes sb-btn-pulse {
		0% { box-shadow: 0 0 0 0 rgba(238, 38, 95, 0.4); }
		70% { box-shadow: 0 0 0 15px rgba(238, 38, 95, 0); }
		100% { box-shadow: 0 0 0 0 rgba(238, 38, 95, 0); }
	}
	@keyframes sb-cap-throw {
		0% {
			transform: translateY(0) rotate(0deg);
			animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1);
		}
		50% {
			transform: translateY(-130px) rotate(360deg);
			animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.3);
		}
		100% {
			transform: translateY(0) rotate(720deg);
		}
	}
	.sb-cap-icon.sb-cap-throwing {
		animation: sb-cap-throw 1.1s linear forwards;
		pointer-events: none;
	}
	@media (prefers-reduced-motion: reduce) {
		.sb-cap-icon, .sb-cap-icon.sb-cap-throwing { animation: none; }
	}
</style>

<!-- MAIN CARD (Desktop + Mobile floating popup) -->
<div id="sb-promo-card">
	<div class="sb-controls">
		<div id="sb-btn-minimize" class="sb-control-btn" title="Close">&#10005;</div>
	</div>

	<div class="sb-card-header">
		<svg class="sb-cap-icon" viewBox="0 0 80 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
			<path d="M40 4 L76 22 L40 40 L4 22 Z" fill="currentColor"/>
			<path d="M16 28 V42 C16 49 26 54 40 54 C54 54 64 49 64 42 V28 L40 40 L16 28 Z" fill="currentColor"/>
			<path d="M73 23 V46" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
			<circle cx="73" cy="50" r="4" fill="currentColor"/>
		</svg>
		<div class="sb-eyebrow">Grad Season</div>
		<div class="sb-headline">Race Into <span>Graduation</span></div>
	</div>

	<div class="sb-card-body">
		<div class="sb-subtitle">Plan An Unforgettable Celebration</div>

		<a href="https://velocitysimlounge.com/party-packs/" target="_blank" class="sb-card-btn">
			Plan Your Party
		</a>
	</div>
</div>

<!-- SHARED: MINIMIZED TAB -->
<div id="sb-promo-minimized">
	Plan Your Grad Party
</div>

<!-- JavaScript Logic -->
<script>
(function() {
	var version = "sb-grad-v7";

	if (sessionStorage.getItem('sbPromoVersion') !== version) {
		sessionStorage.removeItem('sbMobileMin');
		sessionStorage.removeItem('sbDesktopMin');
		sessionStorage.removeItem('sbCardMin');
		sessionStorage.setItem('sbPromoVersion', version);
	}

	var card = document.getElementById("sb-promo-card");
	var mini = document.getElementById("sb-promo-minimized");
	var btnMin = document.getElementById("sb-btn-minimize");
	var capEl = document.querySelector('.sb-cap-icon');
	var autoThrowId = null;
	/* After a throw ends, if the pointer is still over the cap we keep this true so a stray
	   mouseenter (from transform / pointer-events) cannot start another throw until the user leaves. */
	var capHoverThrowNeedsLeave = false;

	function throwCap(capEl, hostCard) {
		if (!capEl || capEl.classList.contains('sb-cap-throwing')) return false;
		if (hostCard) hostCard.classList.add('sb-card-throw-active');
		capEl.classList.add('sb-cap-throwing');
		var cleanup = function() {
			capEl.classList.remove('sb-cap-throwing');
			if (hostCard) hostCard.classList.remove('sb-card-throw-active');
			try {
				capHoverThrowNeedsLeave = capEl.matches(':hover');
			} catch (err) {
				capHoverThrowNeedsLeave = false;
			}
		};
		capEl.addEventListener('animationend', cleanup, { once: true });
		// Fallback in case animationend never fires (e.g. reduced-motion)
		setTimeout(cleanup, 1400);
		return true;
	}

	function startCapAutoThrow() {
		if (!capEl) return;
		try {
			if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
		} catch (e) {}
		stopCapAutoThrow();
		function scheduleNext(delayMs) {
			autoThrowId = setTimeout(function() {
				autoThrowId = null;
				if (card && card.style.display !== 'none') throwCap(capEl, card);
				scheduleNext(5000);
			}, delayMs);
		}
		scheduleNext(1000);
	}

	function stopCapAutoThrow() {
		if (autoThrowId) {
			clearTimeout(autoThrowId);
			autoThrowId = null;
		}
	}

	function showCard() {
		if (card) card.style.display = "block";
		if (mini) mini.style.display = "none";
		sessionStorage.setItem('sbCardMin', 'false');
		startCapAutoThrow();
	}
	function hideCard() {
		stopCapAutoThrow();
		if (card) card.style.display = "none";
		if (mini) mini.style.display = "block";
		sessionStorage.setItem('sbCardMin', 'true');
	}

	sessionStorage.getItem('sbCardMin') === 'true' ? hideCard() : showCard();

	if (btnMin) btnMin.addEventListener('click', hideCard);
	if (mini) mini.addEventListener('click', showCard);

	if (capEl) {
		capEl.addEventListener('mouseenter', function() {
			if (capHoverThrowNeedsLeave) return;
			throwCap(capEl, card);
		});
		capEl.addEventListener('mouseleave', function() {
			if (capEl.classList.contains('sb-cap-throwing')) return;
			capHoverThrowNeedsLeave = false;
		});
		capEl.addEventListener('click', function() { throwCap(capEl, card); });
	}
})();
</script>
