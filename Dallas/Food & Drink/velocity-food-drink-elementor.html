    });
    photo.addEventListener('pointercancel', function () { dragging = false; tracking = false; });
    photo.addEventListener('mouseenter', function () { paused = true; stopRotate(); });
    photo.addEventListener('mouseleave', function () { paused = false; dragging = false; startRotate(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopRotate();
      else startRotate();
    });
  }

  var lb = root.querySelector('#vsl-fooddrink-lightbox');
  if (!lb) return;
  var lbPages = lb.querySelector('.vsl-fooddrink-lightbox__pages');
  var lbPanel = lb.querySelector('.vsl-fooddrink-lightbox__panel');
  var lbClose = lb.querySelector('.vsl-fooddrink-lightbox__close');
  var lastFocus = null;

  function openLightbox(startBtn) {
    lastFocus = document.activeElement;
    lbPages.textContent = '';
    var target = null;
    root.querySelectorAll('[data-vsl-lightbox]').forEach(function (btn) {
      var srcImg = btn.querySelector('img');
      var img = document.createElement('img');
      img.className = 'vsl-fooddrink-lightbox__img';
      img.src = btn.getAttribute('data-full');
      img.alt = srcImg ? (srcImg.getAttribute('alt') || '') : '';
      if (srcImg) {
        img.width = srcImg.width || 1901;
        img.height = srcImg.height || 2852;
      }
      lbPages.appendChild(img);
      if (btn === startBtn) target = img;
    });
    lb.classList.add('is-open');
    lb.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';
    if (lbClose) lbClose.focus();
    if (target && lbPanel) {
      requestAnimationFrame(function () {
        var top = target.getBoundingClientRect().top - lbPanel.getBoundingClientRect().top + lbPanel.scrollTop;
        lbPanel.scrollTop = top;
      });
    }
  }
  function closeLightbox() {
    lb.classList.remove('is-open');
    lb.setAttribute('aria-hidden', 'true');
    lbPages.textContent = '';
    if (lbPanel) lbPanel.scrollTop = 0;
    document.documentElement.style.overflow = '';
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }
  root.querySelectorAll('[data-vsl-lightbox]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openLightbox(btn);
    });
  });
  lb.addEventListener('click', function (e) {
    if (e.target === lb.querySelector('.vsl-fooddrink-lightbox__backdrop') || e.target === lbClose) closeLightbox();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && lb.classList.contains('is-open')) closeLightbox();
  });
})();
</script>
