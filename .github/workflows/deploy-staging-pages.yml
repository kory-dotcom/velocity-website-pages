name: Deploy staging site

# Requires repo Settings → Pages → Build and deployment → Source: GitHub Actions.
# If Source is still "Deploy from branch", the built-in pages-build-deployment
# workflow also runs on every push and races this deploy (400 in-progress conflict).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-progress deploys — cancellation often wedges GitHub Pages sync.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          echo "Pages build_type=$build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::warning::Pages is still on legacy branch deploy ($build_type). Switch to GitHub Actions in repo Settings → Pages to stop duplicate deploys. This run will wait and retry if the legacy workflow is still publishing."
          fi

      - name: Prepare staging artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'Custom Site' \
            --exclude 'Deliverables' \
            --exclude 'scripts' \
            --exclude 'Blog' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for in-progress Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            if ! deployments=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments?per_page=1" 2>/dev/null); then
              echo "No prior Pages deployments yet; continuing."
              exit 0
            fi
            state=$(echo "$deployments" | jq -r '.[0].state // "none"')
            version=$(echo "$deployments" | jq -r '.[0].pages_build_version // ""')
            echo "Latest Pages deployment: state=$state sha=${version:0:7}"
            if [ "$state" != "queued" ] && [ "$state" != "in_progress" ]; then
              echo "No conflicting deployment in progress."
              exit 0
            fi
            echo "Waiting 20s for in-progress deployment ($attempt/18)..."
            sleep 20
          done
          echo "Proceeding after wait timeout."

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait and retry deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fail if deploy did not succeed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deploy failed after retry. If Pages Source is still 'Deploy from branch', switch it to GitHub Actions in repo Settings → Pages."
          exit 1
