<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ignition — Velocity Sim Lounge (Preview)</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #120A0E; }
  </style>
</head>
<body>

<div id="module-mount"></div>

<script>
(function() {
  var mount = document.getElementById('module-mount');
  var loaded = false;
  fetch('velocity-ignition-elementor.html')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      if (loaded) return;
      loaded = true;
      mount.innerHTML = html;
      var scripts = mount.querySelectorAll('script');
      scripts.forEach(function(s) {
        if (s.src) return;
        var ns = document.createElement('script');
        ns.textContent = s.textContent;
        s.parentNode.replaceChild(ns, s);
      });
    });
})();
</script>

</body>
</html>
