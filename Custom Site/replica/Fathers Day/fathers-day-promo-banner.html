<!-- CSS for the Party Pack cross-sell floating popup (Desktop + Mobile) -->
<style>
	@import url('https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&display=swap');

	:root {
		--sb-navy: #10182B;
		--sb-magenta: #EE265F;
		--sb-blue: #293893;
		--sb-yellow: #FDC70C;
		/* Sits above page content but BELOW the Velocity navbar (--z-navbar: 9999),
		   its Explore mega menu (9998), and the mobile menu overlay (10000) so the
		   nav always remains usable when this card is on screen. Raise via Customizer
		   if you want the card to overlap the nav again. */
		--sb-banner-z: 9000;
	}

	/* =========================================
	   FLOATING CARD (Desktop + Mobile)
	   ========================================= */
	#sb-promo-card {
		display: none;
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		width: 90%;
		max-width: 520px;
		z-index: var(--sb-banner-z);
		background: white;
		border-radius: 28px;
		overflow: hidden;
		box-shadow: 0 30px 60px rgba(16, 24, 43, 0.45);
		text-align: center;
		font-family: 'Khand', system-ui, sans-serif;
		animation: sb-card-entry 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
	}

	#sb-promo-minimized {
		display: none;
		position: fixed;
		bottom: 30px;
		right: 30px;
		z-index: var(--sb-banner-z);
		background: var(--sb-magenta);
		color: white;
		padding: 12px 28px;
		border-radius: 50px;
		cursor: pointer;
		font-family: 'Khand', system-ui, sans-serif;
		text-transform: uppercase;
		font-weight: 700;
		font-style: italic;
		font-size: 17px;
		letter-spacing: 0.5px;
		box-shadow: 0 10px 20px rgba(238, 38, 95, 0.35);
		transition: transform 0.2s;
		animation: sb-bounce-in 0.5s;
	}

	#sb-promo-minimized:hover {
		transform: scale(1.1);
	}

	.sb-card-header {
		background: linear-gradient(162deg, #191B4D 0%, var(--sb-navy) 100%);
		padding: 40px 24px 48px;
		position: relative;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		border-radius: 28px 28px 0 0;
	}

	.sb-promo-icon {
		width: 64px;
		height: auto;
		color: var(--sb-yellow);
		margin-bottom: 14px;
		filter: drop-shadow(0 6px 14px rgba(253, 199, 12, 0.35));
	}

	.sb-eyebrow {
		display: inline-block;
		padding: 6px 20px;
		font-size: 13px;
		font-weight: 700;
		font-style: italic;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: #fff;
		background: linear-gradient(135deg, #D22026 0%, var(--sb-magenta) 100%);
		border-radius: 0;
		margin-bottom: 16px;
	}

	.sb-headline {
		font-size: 42px;
		line-height: 1.05;
		text-transform: uppercase;
		font-weight: 700;
		font-style: italic;
		color: white;
		letter-spacing: 0.02em;
		margin: 0;
	}

	.sb-headline span {
		color: var(--sb-yellow);
	}

	.sb-card-body {
		padding: 28px 36px 40px;
		background: white;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 12px;
		border-radius: 0 0 28px 28px;
	}

	.sb-promo-copy {
		font-size: 18px;
		text-transform: none;
		color: var(--sb-blue);
		font-weight: 500;
		font-style: normal;
		margin: 0;
		line-height: 1.35;
		max-width: 26rem;
	}

	.sb-card-btn {
		position: relative;
		background: var(--sb-magenta);
		color: white;
		text-decoration: none;
		font-family: 'Khand', system-ui, sans-serif;
		font-size: 28px;
		font-weight: 700;
		font-style: italic;
		display: inline-block;
		border-radius: 14px;
		padding: 14px 48px;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		transition: all 0.3s ease;
		box-shadow: 0 10px 25px rgba(238, 38, 95, 0.35);
		animation: sb-btn-pulse 2s infinite;
		border: none;
		cursor: pointer;
		text-align: center;
		-webkit-appearance: none;
		appearance: none;
	}

	button.sb-card-btn::-moz-focus-inner {
		border: 0;
		padding: 0;
	}

	.sb-card-btn:hover {
		transform: scale(1.05);
		background: #d41e53;
		color: white;
	}

	.sb-controls {
		position: absolute;
		top: 14px;
		right: 18px;
		z-index: 10;
	}

	.sb-control-btn {
		cursor: pointer;
		font-size: 22px;
		color: rgba(255,255,255,0.4);
		transition: all 0.2s;
		font-family: Arial, sans-serif;
	}

	.sb-control-btn:hover { color: white; }

	/* =========================================
	   MOBILE TIGHTENING (≤ 768px)
	   Same floating popup, scaled down for phones.
	   ========================================= */
	@media (max-width: 768px) {
		#sb-promo-card {
			max-width: 380px;
			border-radius: 22px;
		}
		.sb-card-header {
			padding: 30px 20px 34px;
			border-radius: 22px 22px 0 0;
		}
		.sb-card-body {
			padding: 22px 24px 30px;
			border-radius: 0 0 22px 22px;
		}
		.sb-promo-icon {
			width: 50px;
			margin-bottom: 10px;
		}
		.sb-eyebrow {
			padding: 5px 16px;
			font-size: 11px;
			margin-bottom: 12px;
		}
		.sb-headline {
			font-size: 32px;
		}
		.sb-promo-copy {
			font-size: 16px;
		}
		.sb-card-btn {
			font-size: 22px;
			padding: 12px 36px;
			border-radius: 12px;
		}
		.sb-controls {
			top: 10px;
			right: 12px;
		}
		.sb-control-btn {
			font-size: 24px;
			color: rgba(255,255,255,0.55);
		}
		#sb-promo-minimized {
			bottom: 16px;
			right: 16px;
			padding: 10px 22px;
			font-size: 15px;
		}
	}

	/* Animations */
	@keyframes sb-card-entry {
		from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
		to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
	}
	@keyframes sb-bounce-in {
		0% { transform: scale(0); }
		100% { transform: scale(1); }
	}
	@keyframes sb-btn-pulse {
		0% { box-shadow: 0 0 0 0 rgba(238, 38, 95, 0.4); }
		70% { box-shadow: 0 0 0 15px rgba(238, 38, 95, 0); }
		100% { box-shadow: 0 0 0 0 rgba(238, 38, 95, 0); }
	}
</style>

<!-- MAIN CARD (Desktop + Mobile floating popup) -->
<div id="sb-promo-card">
	<div class="sb-controls">
		<div id="sb-btn-minimize" class="sb-control-btn" title="Close">&#10005;</div>
	</div>

	<div class="sb-card-header">
		<svg class="sb-promo-icon" viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
			<path d="M40 8l6 14h14l-11 10 4 17-13-10-13 10 4-17L16 22h14L40 8z" stroke="currentColor" stroke-width="3" stroke-linejoin="round" fill="none"/>
			<path d="M18 62c8-12 34-12 42 0" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
		</svg>
		<div class="sb-eyebrow">Large groups</div>
		<div class="sb-headline">Planning Something<br><span>Even Bigger?</span></div>
	</div>

	<div class="sb-card-body">
		<p class="sb-promo-copy">Book a Party Pack for large groups and more racing!</p>

		<button type="button" id="sb-card-cta" class="sb-card-btn" data-sb-url="https://velocitysimlounge.com/party-packs/">
			View party packs
		</button>
	</div>
</div>

<!-- SHARED: MINIMIZED TAB -->
<div id="sb-promo-minimized">
	Party packs
</div>

<!-- JavaScript Logic -->
<script>
(function() {
	var version = "sb-party-pack-promo-v1";

	if (sessionStorage.getItem('sbPromoVersion') !== version) {
		sessionStorage.removeItem('sbMobileMin');
		sessionStorage.removeItem('sbDesktopMin');
		sessionStorage.removeItem('sbCardMin');
		sessionStorage.setItem('sbPromoVersion', version);
	}

	var card = document.getElementById("sb-promo-card");
	var mini = document.getElementById("sb-promo-minimized");

	/* Elementor (and similar builders) often nest HTML inside columns with transform or overflow.
	   That traps position:fixed and can hide or clip the popup on mobile—moving nodes to body fixes it. */
	function sbAttachPromoToBody() {
		try {
			if (card && card.parentNode && card.parentNode !== document.body) {
				document.body.appendChild(card);
			}
			if (mini && mini.parentNode && mini.parentNode !== document.body) {
				document.body.appendChild(mini);
			}
		} catch (err) {}
	}
	sbAttachPromoToBody();

	var ctaBtn = card ? card.querySelector('#sb-card-cta') : null;
	if (ctaBtn) {
		function sbCtaUrl() {
			return ctaBtn.getAttribute('data-sb-url') || '';
		}
		function sbGoCtaSameTab(e) {
			if (ctaBtn.getAttribute('data-sb-nav-pending') === '1') {
				if (e && e.preventDefault) e.preventDefault();
				return;
			}
			var url = sbCtaUrl();
			if (!url) return;
			if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)) {
				window.open(url, '_blank', 'noopener,noreferrer');
				if (e.preventDefault) e.preventDefault();
				return;
			}
			if (e && typeof e.button === 'number' && e.button !== 0) return;
			ctaBtn.setAttribute('data-sb-nav-pending', '1');
			if (e && e.preventDefault) {
				e.preventDefault();
				e.stopPropagation();
				e.stopImmediatePropagation();
			}
			window.location.assign(url);
		}
		/* Button (not <a>) avoids WP “external links → new tab” mutations; touch handler beats late scripts on phones. */
		ctaBtn.addEventListener('click', sbGoCtaSameTab, true);
		ctaBtn.addEventListener(
			'touchend',
			function(e) {
				if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
				sbGoCtaSameTab(e);
			},
			{ passive: false, capture: true }
		);
	}

	var btnMin = document.getElementById("sb-btn-minimize");

	function showCard() {
		if (card) card.style.display = "block";
		if (mini) mini.style.display = "none";
		sessionStorage.setItem('sbCardMin', 'false');
	}
	function hideCard() {
		if (card) card.style.display = "none";
		if (mini) mini.style.display = "block";
		sessionStorage.setItem('sbCardMin', 'true');
	}

	sessionStorage.getItem('sbCardMin') === 'true' ? hideCard() : showCard();

	if (btnMin) btnMin.addEventListener('click', hideCard);
	if (mini) mini.addEventListener('click', showCard);
})();
</script>
