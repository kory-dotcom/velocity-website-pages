<!-- Velocity Sim Racing Lounge — Global Footer (Elementor Custom HTML; location-aware) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@400;500;600&family=Khand:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap">

<style>
/* Elementor: let footer span full width like navbar */
.elementor-widget-html .elementor-widget-container:has(.vsl-site-footer),
.elementor-element .elementor-widget-container:has(.vsl-site-footer),
.elementor-section:has(.vsl-site-footer),
.elementor-element:has(.vsl-site-footer) {
  padding: 0 !important;
  margin: 0 !important;
  max-width: 100% !important;
  width: 100% !important;
}

/* Kill white hairline gaps *above* the pink stripe (Elementor wrappers + subpixel stacking) */
.elementor-widget-html .elementor-widget-container:has(.vsl-site-footer),
.elementor-element .elementor-widget-container:has(.vsl-site-footer) {
  margin-top: -14px !important;
  padding-top: 0 !important;
}
.elementor-section:has(.vsl-site-footer),
.elementor-element:has(.vsl-site-footer),
.e-con:has(.vsl-site-footer),
.e-con-inner:has(.vsl-site-footer),
.e-flex:has(.vsl-site-footer) {
  margin-top: -14px !important;
}

.vsl-site-footer {
  --navy: #10182B;
  --navy-deep: #191840;
  --magenta: #EE265F;
  --blue: #293893;
  --circuit-white: #EAEAEA;
  --mist: #B2AEBF;
  --vsl-stripe-bg: #ff2f5a;
  --font-head: 'Khand', system-ui, sans-serif;
  --font-body: 'Archivo Narrow', 'Inter', system-ui, sans-serif;
  --vsl-ui-scale: 1.05;

  box-sizing: border-box;
  position: relative;
  width: 100%;
  margin: -10px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  font-family: var(--font-body);
  font-size: calc(15px * var(--vsl-ui-scale));
  line-height: 1.5;
  color: var(--circuit-white);
  background: linear-gradient(180deg, var(--navy) 0%, #060912 100%);
  -webkit-font-smoothing: antialiased;
}
.vsl-site-footer *, .vsl-site-footer *::before, .vsl-site-footer *::after { box-sizing: border-box; }

/* Solid bridge over stubborn gaps between last page section & pink stripe */
.vsl-site-footer::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: -20px;
  height: 20px;
  z-index: 0;
  pointer-events: none;
  background: var(--navy);
}

.vsl-site-footer__stripe {
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  height: calc(3px * var(--vsl-ui-scale));
  width: 100%;
  margin: 0 0 -2px;
  padding: 0;
  line-height: 0;
  font-size: 0;
  background: var(--vsl-stripe-bg);
}

.vsl-site-footer__wrap {
  position: relative;
  z-index: 1;
  padding: clamp(40px, 5.5vw, 68px) clamp(20px, 4vw, 48px) clamp(28px, 4vw, 40px);
}

.vsl-site-footer a {
  color: inherit;
  text-decoration: none;
  transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.vsl-site-footer a:hover { color: #fff; }

.vsl-site-footer__inner {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1.12fr) minmax(0, 0.9fr);
  gap: clamp(24px, 3.5vw, 44px);
  align-items: start;
}

.vsl-site-footer__logo {
  display: block;
  margin: 0;
  line-height: 0;
}
.vsl-site-footer__logo img {
  height: clamp(calc(36px * var(--vsl-ui-scale)), 4.5vw, calc(46px * var(--vsl-ui-scale)));
  width: auto;
  display: block;
  transition: filter 0.35s ease;
}
.vsl-site-footer__logo:hover img {
  filter: brightness(1.12) drop-shadow(0 0 8px rgba(238, 38, 95, 0.35));
}

.vsl-site-footer__heading {
  margin: 0 0 calc(12px * var(--vsl-ui-scale));
  font-family: var(--font-head);
  font-size: calc(1.05rem * var(--vsl-ui-scale));
  font-weight: 700;
  font-style: italic;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #fff;
  line-height: 1.15;
}
.vsl-site-footer__heading--plain {
  font-family: var(--font-body);
  font-style: normal;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: none;
}

.vsl-site-footer__contact-block + .vsl-site-footer__heading {
  margin-top: calc(22px * var(--vsl-ui-scale));
}

.vsl-site-footer__contact-line {
  margin: 0 0 8px;
  color: rgba(234, 234, 234, 0.92);
  font-size: calc(0.94rem * var(--vsl-ui-scale));
}
.vsl-site-footer__contact-line a {
  text-decoration: underline;
  text-decoration-color: rgba(238, 38, 95, 0.4);
  text-underline-offset: 3px;
}
.vsl-site-footer__contact-line a:hover {
  text-decoration-color: var(--magenta);
  color: #fff;
}

.vsl-site-footer__ql-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 20px;
}
.vsl-site-footer__ql-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-head);
  font-size: calc(0.78rem * var(--vsl-ui-scale));
  font-weight: 700;
  font-style: italic;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 0;
  border-bottom: 2px solid transparent;
  width: fit-content;
  max-width: 100%;
  color: var(--circuit-white);
  position: relative;
}
.vsl-site-footer__ql-link:hover {
  color: #fff;
}
.vsl-site-footer__ql-link.is-active {
  border-bottom-color: var(--magenta);
  color: var(--magenta);
}
.vsl-site-footer__ql-link svg {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  opacity: 0.8;
}
.vsl-site-footer__ql-link--muted { color: rgba(234, 234, 234, 0.88); }
.vsl-site-footer__ql-link--muted svg { opacity: 0.55; }

.vsl-site-footer__social-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.vsl-site-footer__social {
  display: flex;
  align-items: center;
  justify-content: center;
  width: calc(46px * var(--vsl-ui-scale));
  height: calc(46px * var(--vsl-ui-scale));
  border-radius: calc(8px * var(--vsl-ui-scale));
  background: rgba(25, 24, 64, 0.55);
  border: 1px solid rgba(41, 56, 147, 0.45);
  color: #fff;
}
.vsl-site-footer__social:hover {
  background: rgba(238, 38, 95, 0.22);
  border-color: rgba(238, 38, 95, 0.55);
  color: #fff;
  box-shadow: 0 0 20px rgba(238, 38, 95, 0.15);
}
.vsl-site-footer__social svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

.vsl-site-footer__rule {
  max-width: 1200px;
  margin: clamp(28px, 4vw, 44px) auto 0;
  border: 0;
  border-top: 1px dotted rgba(178, 174, 191, 0.35);
}
.vsl-site-footer__copy {
  max-width: 1200px;
  margin: 16px auto 0;
  padding: 0 clamp(20px, 4vw, 48px) 8px;
  text-align: center;
  font-size: calc(0.8rem * var(--vsl-ui-scale));
  color: var(--mist);
}

@media (max-width: 960px) {
  .vsl-site-footer__inner {
    grid-template-columns: 1fr 1fr;
  }
  .vsl-site-footer__brand { grid-column: 1 / -1; }
  .vsl-site-footer__social-col { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .vsl-site-footer__inner {
    grid-template-columns: 1fr;
  }
  .vsl-site-footer__ql-grid {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
(function () {
  var STORAGE_KEY = 'vslPreferredLocation';
  /* Keep in sync with Contact page VSL_LOCATIONS / navbar location keys */
  var LOC = {
    houston: {
      addressLine: '2110 Edwards St, Houston, TX 77007',
      mapsUrl: 'https://maps.app.goo.gl/B9jCNecVWwU5HsVo6',
      phone: '832-627-4981',
      phoneTel: 'tel:+18326274981',
      careersMail: 'info@velocitysimlounge.com'
    },
    dallas: {
      addressLine: 'Dallas, TX — Coming Summer 2026',
      mapsUrl: 'https://velocitysimlounge.com/dallas',
      phone: '',
      phoneTel: '',
      careersMail: 'info@velocitysimlounge.com'
    }
  };

  var root = document.getElementById('vsl-site-footer');
  if (!root) return;

  var addrA = root.querySelector('[data-vsl-footer-address]');
  var addrText = root.querySelector('[data-vsl-footer-address-text]');
  var phoneRow = root.querySelector('[data-vsl-footer-phone-row]');
  var phoneA = root.querySelector('[data-vsl-footer-phone]');
  var phoneText = root.querySelector('[data-vsl-footer-phone-text]');
  var yearEl = root.querySelector('[data-vsl-footer-year]');
  var careersA = root.querySelector('[data-vsl-footer-careers-mail]');

  if (yearEl) yearEl.textContent = String(new Date().getFullYear());

  function normalize(key) {
    return key === 'dallas' ? 'dallas' : 'houston';
  }

  function readLocation() {
    try {
      return normalize(localStorage.getItem(STORAGE_KEY));
    } catch (_) {
      return 'houston';
    }
  }

  function applyLocation(key) {
    var loc = LOC[normalize(key)] || LOC.houston;

    if (addrText) addrText.textContent = loc.addressLine;
    if (addrA) {
      if (loc.mapsUrl) {
        addrA.setAttribute('href', loc.mapsUrl);
        addrA.hidden = false;
      } else {
        addrA.removeAttribute('href');
        addrA.hidden = true;
      }
    }

    if (careersA && loc.careersMail) {
      careersA.setAttribute('href', 'mailto:' + loc.careersMail);
      careersA.textContent = loc.careersMail;
    }

    if (phoneRow && phoneA && phoneText) {
      if (loc.phone && loc.phoneTel) {
        phoneA.setAttribute('href', loc.phoneTel);
        phoneText.textContent = loc.phone;
        phoneA.hidden = false;
        phoneRow.style.display = '';
      } else {
        phoneA.setAttribute('href', loc.mapsUrl || 'https://velocitysimlounge.com/dallas');
        phoneText.textContent = 'Opening Summer 2026 — get updates';
        phoneA.hidden = false;
        phoneRow.style.display = '';
      }
    }
  }

  function markActiveNav() {
    var path = window.location.pathname.replace(/\/+$/, '').toLowerCase();
    root.querySelectorAll('[data-footer-nav]').forEach(function (a) {
      var p = '';
      try {
        p = new URL(a.getAttribute('href'), window.location.origin).pathname.replace(/\/+$/, '').toLowerCase();
      } catch (_) {}
      a.classList.toggle('is-active', !!p && path === p);
    });
  }

  applyLocation(readLocation());
  markActiveNav();

  window.addEventListener('storage', function (e) {
    if (e.key === STORAGE_KEY && e.newValue) applyLocation(e.newValue);
  });

  window.addEventListener('_vslLocationChanged', function (e) {
    if (e.detail && e.detail.location) applyLocation(e.detail.location);
  });
})();
</script>
