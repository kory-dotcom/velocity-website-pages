<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — Corporate Events | Velocity Sim Racing Lounge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Archivo Narrow', system-ui, -apple-system, sans-serif;
      background: #101828;
      color: #eaeaea;
    }
    .preview-banner {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #FDC70C;
      color: #101828;
      text-align: center;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .preview-site-header,
    .preview-site-footer {
      background: #0d1420;
      border-bottom: 1px solid rgba(234,234,234,0.08);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .preview-site-footer {
      border-bottom: none;
      border-top: 1px solid rgba(234,234,234,0.08);
      justify-content: center;
      font-size: 13px;
      color: rgba(234,234,234,0.4);
    }
    .preview-site-header__logo {
      font-family: 'Khand', system-ui, sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #EAEAEA;
    }
    .preview-site-header__nav {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 13px;
      color: rgba(234,234,234,0.55);
    }
    .elementor-widget-html .elementor-widget-container {
      padding: 0;
      margin: 0;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="preview-banner">LOCAL PREVIEW — This simulates the Elementor page shell. Module content is below.</div>

  <header class="preview-site-header">
    <span class="preview-site-header__logo">Velocity</span>
    <nav class="preview-site-header__nav">
      <span>Book Now</span>
      <span>Events</span>
      <span>Memberships</span>
      <span>Menu</span>
    </nav>
  </header>

  <div class="elementor-widget-html">
    <div class="elementor-widget-container">
      <!-- ========== MODULE START ========== -->
      <div id="vsl-module-inject"></div>
      <!-- ========== MODULE END ========== -->
    </div>
  </div>

  <footer class="preview-site-footer">
    &copy; 2026 Velocity Sim Racing Lounge — Preview shell only
  </footer>

  <script>
    fetch('velocity-corporate-events-elementor.html')
      .then(function(r) { return r.text(); })
      .then(function(html) {
        document.getElementById('vsl-module-inject').outerHTML = html;
      })
      .catch(function(err) {
        document.getElementById('vsl-module-inject').innerHTML =
          '<p style="color:red;padding:40px;text-align:center;">Failed to load module: ' + err.message + '</p>';
      });
  </script>
</body>
</html>
